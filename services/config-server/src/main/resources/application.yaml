server:
  port: 8888
spring:
  profiles:
    active: dev
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          clone-on-start: true
          default-label: dev
      bus:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: busrefresh, health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true