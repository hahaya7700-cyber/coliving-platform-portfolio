name: images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontends/**"
      - ".github/workflows/images.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name:
          - eureka-server
          - config-server
          - api-gateway
          - user-service
          - property-service
          - community-service
          - reservation-service
          - dashboard-service
          - document-service
          - contract-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.name }}
          push: true
          tags: ghcr.io/ibm05-team-3/${{ matrix.name }}:latest

  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user-web
            build-args: |
              VITE_BACKEND_API_BASE_URL=https://api.darkhanmarie.site
          - name: admin-web
            build-args: |
              VITE_BACKEND_API_BASE_URL=https://api.darkhanmarie.site
              VITE_GRAFANA_URL=https://grafana.darkhanmarie.site
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontends/${{ matrix.name }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ghcr.io/ibm05-team-3/${{ matrix.name }}:latest
